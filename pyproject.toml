[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "docutils-rust"
version = "0.1.0"
description = "Rust port of python/docutils: reStructuredText parser, transform pipeline, and HTML publisher"
authors = [{ name = "docutils-rust contributors" }]
maintainers = [{ name = "docutils-rust publishers" }]
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
keywords = ["docutils", "rst", "restructuredtext", "rust"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/docutils-rust"
Upstream = "https://github.com/python/docutils"

[tool.maturin]
module-name = "docutils_rust._core"
bindings = "pyo3"
# The reusable Rust core ships inside the sdist as a path dependency, so the
# unpacked sdist rebuilds the wheel with no network checkout.
sdist-include = ["docutils-core/**/*", "NOTICE", "LICENSE", "release.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
