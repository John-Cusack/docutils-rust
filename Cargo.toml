[workspace]
members = ["docutils-core"]
resolver = "2"

[package]
name = "docutils-py"
version = "0.1.0"
edition = "2024"
description = "Python bindings for the docutils-rust port"
license = "MIT"
repository = "https://github.com/John-Cusack/docutils-rust"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
docutils-core = { version = "0.1.0", path = "docutils-core" }
pyo3 = { version = "0.24", features = ["extension-module"] }
