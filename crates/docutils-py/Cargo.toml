[package]
name = "docutils-py"
version = "0.1.0"
edition = "2024"
description = "Python bindings for the docutils-rust port"
license = "MIT"

[lib]
name = "docutils_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
docutils-core = { path = "../docutils-core" }
pyo3 = { version = "0.24", features = ["extension-module"] }
